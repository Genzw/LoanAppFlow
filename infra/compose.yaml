services:
  postgres:
    image: postgres:17.11
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      API_MIGRATOR_PASSWORD: ${API_MIGRATOR_PASSWORD:?Set API_MIGRATOR_PASSWORD}
      API_RUNTIME_PASSWORD: ${API_RUNTIME_PASSWORD:?Set API_RUNTIME_PASSWORD}
      MOCK_MIGRATOR_PASSWORD: ${MOCK_MIGRATOR_PASSWORD:?Set MOCK_MIGRATOR_PASSWORD}
      MOCK_RUNTIME_PASSWORD: ${MOCK_RUNTIME_PASSWORD:?Set MOCK_RUNTIME_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
